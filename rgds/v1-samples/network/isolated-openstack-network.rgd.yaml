apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: isolatedopenstacknetwork
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
    kro.run/description: Managed isolated OpenStack network and subnet without router attachment
spec:
  schema:
    apiVersion: v1alpha1
    group: csoc.js2.org
    kind: IsolatedOpenStackNetwork
    scope: Namespaced
    additionalPrinterColumns:
      - name: Ready
        type: boolean
        jsonPath: .status.ready
      - name: CIDR
        type: string
        jsonPath: .status.nodeCIDR
      - name: Network
        type: string
        jsonPath: .status.networkID
    spec:
      description: string | default="KRO-managed isolated OpenStack network"
    status:
      ready: '${network.?status.?conditions.orValue([]).exists(c, c.type == "Available" && c.status == "True") && subnet.?status.?conditions.orValue([]).exists(c, c.type == "Available" && c.status == "True")}'
      identityName: ${identity.metadata.name}
      nodeCIDR: ${networkconfig.data.nodeCIDR}
      networkID: '${network.?status.?id.orValue("")}'
      subnetID: '${subnet.?status.?id.orValue("")}'
  resources:
    - id: accountnamespace
      externalRef:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${schema.metadata.namespace}
    - id: identity
      externalRef:
        apiVersion: csoc.js2.org/v1alpha1
        kind: SpokeIdentity
        metadata:
          name: '${accountnamespace.metadata.labels["csoc.js2.org/identity"]}'
    - id: networkserviceconfig
      externalRef:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: '${identity.metadata.name + "-network-service-config"}'
          namespace: ${schema.metadata.namespace}
    - id: networkconfig
      externalRef:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: '${schema.metadata.name + "-network-config"}'
          namespace: ${schema.metadata.namespace}
    - id: network
      readyWhen:
        - '${network.?status.?conditions.orValue([]).exists(c, c.type == "Available" && c.status == "True")}'
      template:
        apiVersion: openstack.k-orc.cloud/v1alpha1
        kind: Network
        metadata:
          name: '${schema.metadata.name + "-network"}'
          namespace: ${schema.metadata.namespace}
        spec:
          cloudCredentialsRef:
            cloudName: openstack
            secretName: '${identity.metadata.name + "-cloud-config"}'
          managementPolicy: managed
          managedOptions:
            onDelete: delete
          resource:
            name: '${"csoc-" + schema.metadata.name}'
            description: ${schema.spec.description}
            mtu: ${int(networkconfig.data.networkMTU)}
            portSecurityEnabled: '${networkconfig.data.portSecurityEnabled == "true"}'
            tags: [csoc, kro-managed, isolated]
    - id: subnet
      readyWhen:
        - '${subnet.?status.?conditions.orValue([]).exists(c, c.type == "Available" && c.status == "True")}'
      template:
        apiVersion: openstack.k-orc.cloud/v1alpha1
        kind: Subnet
        metadata:
          name: '${schema.metadata.name + "-subnet"}'
          namespace: ${schema.metadata.namespace}
        spec:
          cloudCredentialsRef:
            cloudName: openstack
            secretName: '${identity.metadata.name + "-cloud-config"}'
          managementPolicy: managed
          managedOptions:
            onDelete: delete
          resource:
            name: '${"csoc-" + schema.metadata.name}'
            description: '${"KRO-managed isolated subnet for " + schema.metadata.name}'
            networkRef: ${network.metadata.name}
            cidr: ${networkconfig.data.nodeCIDR}
            ipVersion: 4
            enableDHCP: '${networkconfig.data.enableDHCP == "true"}'
            gateway:
              type: Automatic
            dnsNameservers:
              - ${networkserviceconfig.data.dnsNameserver}
            tags: [csoc, kro-managed, isolated]
    - id: connection
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: '${schema.metadata.name + "-connection"}'
          namespace: ${schema.metadata.namespace}
        immutable: true
        data:
          networkType: isolated
          networkID: ${network.status.id}
          subnetID: ${subnet.status.id}
          routerID: ""
          externalNetworkID: ""
