apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: clusterfoundation.infra.csoc.js2.org
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
    kro.run/description: Argo-owned networking, cloud-provider, storage, and autoscaling foundation delivered into one spoke
spec:
  schema:
    apiVersion: v1alpha1
    group: infra.csoc.js2.org
    kind: ClusterFoundation
    scope: Namespaced
    spec:
      clusterRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      registrationRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      systemPoolRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      configRepository: string | required=true pattern="^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:\\.git)?$"
      configCommit: string | required=true pattern="^[0-9a-f]{40}$"
      configPath: string | default="projects/csoc-v2/foundation" pattern="^[A-Za-z0-9._/-]+$"
      calicoVersion: string | required=true pattern="^v?[0-9]+\\.[0-9]+\\.[0-9]+$"
      ccmChartVersion: string | required=true pattern="^[0-9]+\\.[0-9]+\\.[0-9]+$"
      cinderCSIChartVersion: string | required=true pattern="^[0-9]+\\.[0-9]+\\.[0-9]+$"
      autoscalerChartVersion: string | required=true pattern="^[0-9]+\\.[0-9]+\\.[0-9]+$"
      autoscalerVersion: string | required=true pattern="^v?[0-9]+\\.[0-9]+\\.[0-9]+$"
    status:
      ready: '${registration.status.registered && systempool.spec.class == "system" && systempool.spec.clusterRef.name == cluster.metadata.name && calico.?status.?health.?status.orValue("") == "Healthy" && calico.?status.?sync.?status.orValue("") == "Synced" && ccm.?status.?health.?status.orValue("") == "Healthy" && ccm.?status.?sync.?status.orValue("") == "Synced" && cinder.?status.?health.?status.orValue("") == "Healthy" && cinder.?status.?sync.?status.orValue("") == "Synced" && storageclasses.?status.?health.?status.orValue("") == "Healthy" && storageclasses.?status.?sync.?status.orValue("") == "Synced" && autoscaler.?status.?health.?status.orValue("") == "Healthy" && autoscaler.?status.?sync.?status.orValue("") == "Synced"}'
      clusterName: ${cluster.metadata.name}
      systemPoolName: ${systempool.metadata.name}
      platformClusterName: '${registration.spec.clusterRef.name + "-platform"}'
      projectName: ${platformproject.metadata.name}
  resources:
    - id: cluster
      externalRef: {apiVersion: infra.csoc.js2.org/v1alpha1, kind: WorkloadCluster, metadata: {name: '${schema.spec.clusterRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: registration
      externalRef: {apiVersion: infra.csoc.js2.org/v1alpha1, kind: SpokeRegistration, metadata: {name: '${schema.spec.registrationRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: systempool
      externalRef: {apiVersion: infra.csoc.js2.org/v1alpha1, kind: SpokeNodePool, metadata: {name: '${schema.spec.systemPoolRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: platformproject
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: AppProject
        metadata:
          name: '${schema.metadata.namespace + "-" + schema.metadata.name}'
          namespace: argocd
          labels: {csoc.js2.org/ownership: spoke-platform, csoc.js2.org/workload-cluster: '${cluster.metadata.name}'}
        spec:
          description: Cluster-scoped platform delivery into one registered spoke
          sourceRepos:
            - ${schema.spec.configRepository}
            - https://docs.tigera.io/calico/charts
            - https://kubernetes.github.io/cloud-provider-openstack
            - https://kubernetes.github.io/autoscaler
          destinations: [{name: '${registration.spec.clusterRef.name + "-platform"}', namespace: "*"}]
          clusterResourceWhitelist: [{group: "", kind: Namespace}, {group: apiextensions.k8s.io, kind: CustomResourceDefinition}, {group: rbac.authorization.k8s.io, kind: ClusterRole}, {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}, {group: storage.k8s.io, kind: StorageClass}, {group: storage.k8s.io, kind: CSIDriver}, {group: operator.tigera.io, kind: Installation}, {group: operator.tigera.io, kind: APIServer}, {group: operator.tigera.io, kind: Goldmane}, {group: operator.tigera.io, kind: Whisker}]
          namespaceResourceWhitelist: [{group: "", kind: ConfigMap}, {group: "", kind: Secret}, {group: "", kind: Service}, {group: "", kind: ServiceAccount}, {group: apps, kind: Deployment}, {group: apps, kind: DaemonSet}, {group: batch, kind: Job}, {group: policy, kind: PodDisruptionBudget}, {group: rbac.authorization.k8s.io, kind: Role}, {group: rbac.authorization.k8s.io, kind: RoleBinding}]
          orphanedResources: {warn: true}
    - id: calico
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata: {name: '${schema.metadata.namespace + "-" + schema.metadata.name + "-calico"}', namespace: argocd, labels: {csoc.js2.org/workload-cluster: '${cluster.metadata.name}', csoc.js2.org/ownership: spoke-foundation}, annotations: {argocd.argoproj.io/sync-wave: "-4"}}
        spec:
          project: ${platformproject.metadata.name}
          source:
            repoURL: https://docs.tigera.io/calico/charts
            chart: tigera-operator
            targetRevision: ${schema.spec.calicoVersion}
            helm: {releaseName: calico}
          destination: {name: '${registration.spec.clusterRef.name + "-platform"}', namespace: tigera-operator}
          syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true, ServerSideApply=true]}
          revisionHistoryLimit: 3
    - id: ccm
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata: {name: '${schema.metadata.namespace + "-" + schema.metadata.name + "-ccm"}', namespace: argocd, labels: {csoc.js2.org/workload-cluster: '${cluster.metadata.name}', csoc.js2.org/ownership: spoke-foundation}, annotations: {argocd.argoproj.io/sync-wave: "-3"}}
        spec:
          project: ${platformproject.metadata.name}
          source:
            repoURL: https://kubernetes.github.io/cloud-provider-openstack
            chart: openstack-cloud-controller-manager
            targetRevision: ${schema.spec.ccmChartVersion}
            helm:
              releaseName: openstack-ccm
              valuesObject: {secret: {enabled: true, create: false, name: cloud-config}, podAnnotations: {registration.csoc.js2.org/workload-credential-revision: '${registration.status.workloadCredentialRevision}'}}
          destination: {name: '${registration.spec.clusterRef.name + "-platform"}', namespace: kube-system}
          syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [ServerSideApply=true]}
          revisionHistoryLimit: 3
    - id: cinder
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata: {name: '${schema.metadata.namespace + "-" + schema.metadata.name + "-cinder-csi"}', namespace: argocd, labels: {csoc.js2.org/workload-cluster: '${cluster.metadata.name}', csoc.js2.org/ownership: spoke-foundation}, annotations: {argocd.argoproj.io/sync-wave: "-2"}}
        spec:
          project: ${platformproject.metadata.name}
          source:
            repoURL: https://kubernetes.github.io/cloud-provider-openstack
            chart: openstack-cinder-csi
            targetRevision: ${schema.spec.cinderCSIChartVersion}
            helm:
              releaseName: openstack-cinder-csi
              valuesObject:
                secret: {enabled: true, hostMount: false, create: false, name: cloud-config}
                csi:
                  plugin:
                    controllerPlugin:
                      nodeSelector: {csoc.js2.org/pool-class: system}
                      tolerations: [{key: csoc.js2.org/pool-class, operator: Equal, value: system, effect: NoSchedule}]
                      podAnnotations: {registration.csoc.js2.org/workload-credential-revision: '${registration.status.workloadCredentialRevision}'}
          destination: {name: '${registration.spec.clusterRef.name + "-platform"}', namespace: kube-system}
          syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [ServerSideApply=true]}
          revisionHistoryLimit: 3
    - id: storageclasses
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata: {name: '${schema.metadata.namespace + "-" + schema.metadata.name + "-storage-classes"}', namespace: argocd, labels: {csoc.js2.org/workload-cluster: '${cluster.metadata.name}', csoc.js2.org/ownership: spoke-foundation}, annotations: {argocd.argoproj.io/sync-wave: "-1"}}
        spec:
          project: ${platformproject.metadata.name}
          source:
            repoURL: '${schema.spec.configRepository}'
            targetRevision: '${schema.spec.configCommit}'
            path: '${schema.spec.configPath}'
            kustomize:
              commonAnnotations:
                registration.csoc.js2.org/autoscaler-credential-revision: '${registration.status.autoscalerCredentialRevision}'
          destination: {name: '${registration.spec.clusterRef.name + "-platform"}', namespace: kube-system}
          syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [ServerSideApply=true]}
          revisionHistoryLimit: 3
    - id: autoscaler
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata: {name: '${schema.metadata.namespace + "-" + schema.metadata.name + "-autoscaler"}', namespace: argocd, labels: {csoc.js2.org/workload-cluster: '${cluster.metadata.name}', csoc.js2.org/ownership: spoke-foundation}, annotations: {argocd.argoproj.io/sync-wave: "0"}}
        spec:
          project: ${platformproject.metadata.name}
          source:
            repoURL: https://kubernetes.github.io/autoscaler
            chart: cluster-autoscaler
            targetRevision: ${schema.spec.autoscalerChartVersion}
            helm:
              releaseName: cluster-autoscaler
              valuesObject:
                cloudProvider: clusterapi
                clusterAPIMode: incluster-kubeconfig
                clusterAPICloudConfigPath: /etc/kubernetes/mgmt-kubeconfig
                clusterAPIKubeconfigSecret: csoc-cluster-api-management-kubeconfig
                clusterAPIConfigMapsNamespace: kube-system
                autoDiscovery: {clusterName: '${cluster.metadata.name}', namespace: '${schema.metadata.namespace}'}
                image: {tag: '${schema.spec.autoscalerVersion}'}
                podAnnotations: {registration.csoc.js2.org/autoscaler-credential-revision: '${registration.status.autoscalerCredentialRevision}'}
                nodeSelector: {csoc.js2.org/pool-class: system}
                tolerations: [{operator: Exists}]
          destination: {name: '${registration.spec.clusterRef.name + "-platform"}', namespace: kube-system}
          syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [ServerSideApply=true]}
          revisionHistoryLimit: 3
