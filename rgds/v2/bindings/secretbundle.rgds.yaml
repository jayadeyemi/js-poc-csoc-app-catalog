apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: secretbundle.delivery.csoc.js2.org
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  schema:
    apiVersion: v1alpha1
    group: delivery.csoc.js2.org
    kind: SecretBundle
    scope: Namespaced
    spec:
      boundaryRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      configRepository: string | required=true pattern="^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:\\.git)?$"
      configCommit: string | required=true pattern="^[0-9a-f]{40}$"
      encryptedPath: string | required=true pattern="^[A-Za-z0-9._/-]+\\.sops\\.ya?ml$"
      targetSecretNames: string | required=true pattern="^[a-z0-9]([-a-z0-9,.]*[a-z0-9])?$"
    status:
      ready: '${application.?status.?health.?status.orValue("") == "Healthy" && application.?status.?sync.?status.orValue("") == "Synced"}'
      syncRevision: '${application.?status.?sync.?revision.orValue("")}'
      health: '${application.?status.?health.?status.orValue("Progressing")}'
  resources:
    - id: boundary
      externalRef: {apiVersion: delivery.csoc.js2.org/v1alpha1, kind: ApplicationBoundary, metadata: {name: '${schema.spec.boundaryRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: application
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: '${schema.metadata.namespace + "-" + schema.metadata.name}'
          namespace: argocd
          labels: {csoc.js2.org/workload-cluster: '${boundary.status.clusterName}', csoc.js2.org/ownership: spoke-secret}
          annotations: {argocd.argoproj.io/sync-wave: "-1"}
        spec:
          project: ${boundary.status.projectName}
          source:
            repoURL: ${schema.spec.configRepository}
            targetRevision: ${schema.spec.configCommit}
            path: .
            plugin:
              name: csoc-sops-helm
              env:
                - {name: MODE, value: secrets}
                - {name: CONFIG_PATH, value: '${schema.spec.encryptedPath}'}
                - {name: EXPECTED_SECRETS, value: '${schema.spec.targetSecretNames}'}
          destination: {name: '${boundary.status.clusterName}', namespace: '${boundary.spec.destinationNamespace}'}
          syncPolicy:
            automated: {prune: true, selfHeal: true}
            syncOptions: [CreateNamespace=true, ServerSideApply=true]
          revisionHistoryLimit: 3
