apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: applicationboundary.delivery.csoc.js2.org
  annotations: {argocd.argoproj.io/sync-wave: "-8"}
spec:
  schema:
    apiVersion: v1alpha1
    group: delivery.csoc.js2.org
    kind: ApplicationBoundary
    scope: Namespaced
    spec:
      registrationRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      destinationNamespace: string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
      serviceType: string | required=true enum="smoke,jupyterhub,monitoring,registry-cache,binder-build,jupyter-outpost"
      sourceRepository: string | required=true pattern="^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:\\.git)?$"
    status:
      ready: ${registration.status.registered}
      projectName: '${schema.metadata.namespace + "-" + schema.metadata.name}'
      clusterName: ${registration.spec.clusterRef.name}
      platformClusterName: '${registration.spec.clusterRef.name + "-platform"}'
      monitoringClusterName: '${registration.spec.clusterRef.name + "-monitoring"}'
      namespace: ${schema.spec.destinationNamespace}
  resources:
    - id: registration
      externalRef: {apiVersion: infra.csoc.js2.org/v1alpha1, kind: SpokeRegistration, metadata: {name: '${schema.spec.registrationRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: smokeproject
      includeWhen: ['${schema.spec.serviceType == "smoke"}']
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: AppProject
        metadata: &projectMetadata {name: '${schema.metadata.namespace + "-" + schema.metadata.name}', namespace: argocd, labels: {csoc.js2.org/service-type: '${schema.spec.serviceType}', csoc.js2.org/workload-cluster: '${registration.spec.clusterRef.name}'}}
        spec:
          description: Smoke application boundary
          sourceRepos: ['${schema.spec.sourceRepository}']
          destinations: &destinations [{name: '${registration.spec.clusterRef.name}', namespace: '${schema.spec.destinationNamespace}'}]
          clusterResourceWhitelist: []
          namespaceResourceWhitelist: [{group: "", kind: ConfigMap}, {group: "", kind: Service}, {group: apps, kind: Deployment}]
          orphanedResources: {warn: true}
    - id: hubproject
      includeWhen: ['${schema.spec.serviceType == "jupyterhub"}']
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: AppProject
        metadata: *projectMetadata
        spec:
          description: JupyterHub application boundary
          sourceRepos: ['${schema.spec.sourceRepository}']
          destinations: *destinations
          clusterResourceWhitelist: []
          namespaceResourceWhitelist: [{group: "", kind: ConfigMap}, {group: "", kind: Secret}, {group: "", kind: Service}, {group: "", kind: ServiceAccount}, {group: "", kind: PersistentVolumeClaim}, {group: apps, kind: Deployment}, {group: apps, kind: StatefulSet}, {group: networking.k8s.io, kind: NetworkPolicy}, {group: policy, kind: PodDisruptionBudget}, {group: rbac.authorization.k8s.io, kind: Role}, {group: rbac.authorization.k8s.io, kind: RoleBinding}]
          orphanedResources: {warn: true}
    - id: monitoringproject
      includeWhen: ['${schema.spec.serviceType == "monitoring"}']
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: AppProject
        metadata: *projectMetadata
        spec:
          description: Monitoring application boundary
          sourceRepos: ['${schema.spec.sourceRepository}']
          destinations: [{name: '${registration.spec.clusterRef.name + "-monitoring"}', namespace: '${schema.spec.destinationNamespace}'}]
          clusterResourceWhitelist: [{group: apiextensions.k8s.io, kind: CustomResourceDefinition}, {group: rbac.authorization.k8s.io, kind: ClusterRole}, {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}, {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}, {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}]
          namespaceResourceWhitelist: [{group: "", kind: ConfigMap}, {group: "", kind: Secret}, {group: "", kind: Service}, {group: "", kind: ServiceAccount}, {group: "", kind: PersistentVolumeClaim}, {group: apps, kind: Deployment}, {group: apps, kind: StatefulSet}, {group: apps, kind: DaemonSet}, {group: batch, kind: Job}, {group: rbac.authorization.k8s.io, kind: Role}, {group: rbac.authorization.k8s.io, kind: RoleBinding}, {group: monitoring.coreos.com, kind: Prometheus}, {group: monitoring.coreos.com, kind: PrometheusRule}, {group: monitoring.coreos.com, kind: ServiceMonitor}]
          orphanedResources: {warn: true}
    - id: registryproject
      includeWhen: ['${schema.spec.serviceType == "registry-cache"}']
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: AppProject
        metadata: *projectMetadata
        spec:
          description: Registry cache application boundary
          sourceRepos: ['${schema.spec.sourceRepository}']
          destinations: *destinations
          clusterResourceWhitelist: []
          namespaceResourceWhitelist: [{group: "", kind: ConfigMap}, {group: "", kind: Secret}, {group: "", kind: Service}, {group: "", kind: ServiceAccount}, {group: "", kind: PersistentVolumeClaim}, {group: apps, kind: Deployment}]
          orphanedResources: {warn: true}
    - id: binderproject
      includeWhen: ['${schema.spec.serviceType == "binder-build"}']
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: AppProject
        metadata: *projectMetadata
        spec:
          description: Explicitly approved Binder build boundary
          sourceRepos: ['${schema.spec.sourceRepository}']
          destinations: *destinations
          clusterResourceWhitelist: []
          namespaceResourceWhitelist: [{group: "", kind: ConfigMap}, {group: "", kind: Secret}, {group: "", kind: Service}, {group: "", kind: ServiceAccount}, {group: apps, kind: Deployment}, {group: apps, kind: DaemonSet}, {group: batch, kind: Job}, {group: rbac.authorization.k8s.io, kind: Role}, {group: rbac.authorization.k8s.io, kind: RoleBinding}]
          orphanedResources: {warn: true}
    - id: outpostproject
      includeWhen: ['${schema.spec.serviceType == "jupyter-outpost"}']
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: AppProject
        metadata: *projectMetadata
        spec:
          description: Jupyter Outpost application boundary
          sourceRepos: ['${schema.spec.sourceRepository}']
          destinations: *destinations
          clusterResourceWhitelist: []
          namespaceResourceWhitelist: [{group: "", kind: ConfigMap}, {group: "", kind: Secret}, {group: "", kind: Service}, {group: "", kind: ServiceAccount}, {group: "", kind: PersistentVolumeClaim}, {group: apps, kind: Deployment}, {group: apps, kind: StatefulSet}, {group: networking.k8s.io, kind: NetworkPolicy}, {group: rbac.authorization.k8s.io, kind: Role}, {group: rbac.authorization.k8s.io, kind: RoleBinding}]
          orphanedResources: {warn: true}
