  # installed beside the v1 samples during compatibility testing.
  - v2-hubs
  - v1-samples/cluster/v1/spoke-cluster.rgd.yaml
  - v1-samples/cluster/v1/spoke-identity.rgd.yaml
  - v1-samples/configmaps/immutable-spoke-config.rgd.yaml
  - v1-samples/configmaps/spoke-environment-config.rgd.yaml
  - v1-samples/configmaps/spoke-network-import-config.rgd.yaml
  - v1-samples/configmaps/spoke-shared-network-config.rgd.yaml
  - v1-samples/compute/spoke-keypair.rgd.yaml
  - v1-samples/compute/spoke-server-group.rgd.yaml
  - v1-samples/network/auto-allocated-spoke-network.rgd.yaml
  - v1-samples/network/dedicated-spoke-network.rgd.yaml
  - v1-samples/network/imported-spoke-network.rgd.yaml
  - v1-samples/network/isolated-openstack-network.rgd.yaml
  - v1-samples/network/routed-spoke-network.rgd.yaml
  - v1-samples/network/fully-managed-spoke-network.rgd.yaml
  - v1-samples/network/shared-provider-network.rgd.yaml
  - v1-samples/security/spoke-security-group.rgd.yaml
  - v1-samples/storage/spoke-volume.rgd.yaml
  - v1-samples/workloads/hello-app.rgd.yaml
  - v1-samples/workloads/spoke-argocd.rgd.yaml
  - v1-samples/workloads/spoke-argo-application.rgd.yaml
  - v1-samples/workloads/spoke-hello-app.rgd.yaml
  - v1-samples/workloads/spoke-gitops.rgd.yaml
