apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: immutablespokeconfig
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
    kro.run/description: Write-once trusted inputs for account-scoped spoke graphs
spec:
  schema:
    apiVersion: v1alpha1
    group: csoc.js2.org
    kind: ImmutableSpokeConfig
    scope: Cluster
    additionalPrinterColumns:
      - name: Ready
        type: boolean
        jsonPath: .status.ready
      - name: Project
        type: string
        jsonPath: .status.projectID
    spec:
      projectID: string | required=true pattern="^[0-9a-fA-F]{32}$"
      infrastructure:
        imageID: string | required=true pattern="^[0-9a-fA-F-]{36}$"
        sshKeyName: string | required=true
        externalNetworkID: string | required=true pattern="^[0-9a-fA-F-]{36}$"
        autoAllocatedNetworkName: string | default="auto_allocated_network"
        autoAllocatedSubnetName: string | default="auto_allocated_subnet_v4"
        autoAllocatedRouterName: string | default="auto_allocated_router"
        dnsNameserver: string | default="8.8.8.8"
        apiServerAllowedCIDR: string | default="0.0.0.0/0"
      kubernetes:
        version: string | default="v1.34.8" pattern="^v[0-9]+\\.[0-9]+\\.[0-9]+$"
        controlPlaneCount: integer | default=1 minimum=1 maximum=3
        controlPlaneFlavor: string | required=true
        generalWorkerFlavor: string | required=true
        highmemWorkerFlavor: string | required=true
        gpuWorkerFlavor: string | required=true
        minWorkers: integer | default=1 minimum=1 maximum=4
        maxWorkers: integer | default=4 minimum=1 maximum=4
    status:
      ready: '${accountconfig.metadata.name != "" && infrastructureconfig.metadata.name != "" && kubernetesconfig.metadata.name != ""}'
      projectID: ${schema.spec.projectID}
  resources:
    - id: confignamespace
      externalRef:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: csoc-system
    - id: accountconfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: '${schema.metadata.name + "-account-config"}'
          namespace: ${confignamespace.metadata.name}
        immutable: true
        data:
          projectID: ${schema.spec.projectID}
    - id: infrastructureconfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: '${schema.metadata.name + "-infrastructure-config"}'
          namespace: ${confignamespace.metadata.name}
        immutable: true
        data:
          imageID: ${schema.spec.infrastructure.imageID}
          sshKeyName: ${schema.spec.infrastructure.sshKeyName}
          externalNetworkID: ${schema.spec.infrastructure.externalNetworkID}
          autoAllocatedNetworkName: ${schema.spec.infrastructure.autoAllocatedNetworkName}
          autoAllocatedSubnetName: ${schema.spec.infrastructure.autoAllocatedSubnetName}
          autoAllocatedRouterName: ${schema.spec.infrastructure.autoAllocatedRouterName}
          dnsNameserver: ${schema.spec.infrastructure.dnsNameserver}
          apiServerAllowedCIDR: ${schema.spec.infrastructure.apiServerAllowedCIDR}
    - id: kubernetesconfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: '${schema.metadata.name + "-kubernetes-config"}'
          namespace: ${confignamespace.metadata.name}
        immutable: true
        data:
          version: ${schema.spec.kubernetes.version}
          controlPlaneCount: ${string(schema.spec.kubernetes.controlPlaneCount)}
          controlPlaneFlavor: ${schema.spec.kubernetes.controlPlaneFlavor}
          generalWorkerFlavor: ${schema.spec.kubernetes.generalWorkerFlavor}
          highmemWorkerFlavor: ${schema.spec.kubernetes.highmemWorkerFlavor}
          gpuWorkerFlavor: ${schema.spec.kubernetes.gpuWorkerFlavor}
          minWorkers: ${string(schema.spec.kubernetes.minWorkers)}
          maxWorkers: ${string(schema.spec.kubernetes.maxWorkers)}
