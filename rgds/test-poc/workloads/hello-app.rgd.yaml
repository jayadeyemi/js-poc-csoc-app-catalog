apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    kro.run/description: Internal Hello workload for either CSOC or one CAPI spoke
  name: helloapp
spec:
  resources:
    - id: appnamespace
      includeWhen:
        - ${schema.spec.target == "csoc"}
      readyWhen:
        - ${appnamespace.?status.?phase.orValue("") == "Active"}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          labels:
            csoc.js2.org/managed: "true"
            csoc.js2.org/target: csoc
          name: csoc-apps
    - id: csochtml
      includeWhen:
        - ${schema.spec.target == "csoc"}
      template:
        apiVersion: v1
        data:
          index.html: |
            <!doctype html>
            <html lang="en">
              <head><meta charset="utf-8"><title>Hello App</title></head>
              <body><h1>Hello CSOC.</h1></body>
            </html>
        kind: ConfigMap
        metadata:
          name: hello-app-html
          namespace: ${appnamespace.metadata.name}
    - id: csocdeployment
      includeWhen:
        - ${schema.spec.target == "csoc"}
      readyWhen:
        - ${csocdeployment.?status.?availableReplicas.orValue(0) >= csocdeployment.spec.replicas}
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          labels:
            app: hello-app
            csoc.js2.org/managed: "true"
          name: hello-app
          namespace: ${appnamespace.metadata.name}
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app: hello-app
          template:
            metadata:
              labels:
                app: hello-app
            spec:
              containers:
                - image: nginx:1.25-alpine
                  livenessProbe:
                    httpGet:
                      path: /
                      port: http
                    initialDelaySeconds: 10
                    periodSeconds: 30
                  name: hello-app
                  ports:
                    - containerPort: 80
                      name: http
                  readinessProbe:
                    httpGet:
                      path: /
                      port: http
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  resources:
                    limits:
                      cpu: 100m
                      memory: 128Mi
                    requests:
                      cpu: 50m
                      memory: 64Mi
                  volumeMounts:
                    - mountPath: /usr/share/nginx/html
                      name: html
                      readOnly: true
              volumes:
                - configMap:
                    name: ${csochtml.metadata.name}
                  name: html
    - id: csocservice
      includeWhen:
        - ${schema.spec.target == "csoc"}
      readyWhen:
        - ${csocservice.?status.?loadBalancer.?ingress.orValue([]).size() > 0}
      template:
        apiVersion: v1
        kind: Service
        metadata:
          annotations:
            service.beta.kubernetes.io/openstack-internal-load-balancer: "true"
          labels:
            app: hello-app
            csoc.js2.org/managed: "true"
          name: hello-app
          namespace: ${appnamespace.metadata.name}
        spec:
          ports:
            - name: http
              port: 80
              targetPort: http
          selector:
            app: hello-app
          type: LoadBalancer
    - id: workload
      includeWhen:
        - ${schema.spec.target == "spoke"}
      template:
        apiVersion: v1
        data:
          hello-app.yaml: |
            apiVersion: v1
            kind: Namespace
            metadata:
              name: hello-app
              labels:
                csoc.js2.org/managed: "true"
                csoc.js2.org/app: hello-app
            ---
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: hello-app-html
              namespace: hello-app
            data:
              index.html: |
                <!doctype html>
                <html lang="en">
                  <head><meta charset="utf-8"><title>Hello App</title></head>
                  <body><h1>Hello ${schema.metadata.name}.</h1></body>
                </html>
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: hello-app
              namespace: hello-app
              labels:
                app: hello-app
                csoc.js2.org/managed: "true"
            spec:
              replicas: ${string(schema.spec.replicas)}
              selector:
                matchLabels:
                  app: hello-app
              template:
                metadata:
                  labels:
                    app: hello-app
                spec:
                  containers:
                    - name: hello-app
                      image: nginx:1.25-alpine
                      ports:
                        - name: http
                          containerPort: 80
                      volumeMounts:
                        - name: html
                          mountPath: /usr/share/nginx/html
                          readOnly: true
                      resources:
                        requests:
                          cpu: 50m
                          memory: 64Mi
                        limits:
                          cpu: 100m
                          memory: 128Mi
                      readinessProbe:
                        httpGet:
                          path: /
                          port: http
                        initialDelaySeconds: 5
                        periodSeconds: 10
                      livenessProbe:
                        httpGet:
                          path: /
                          port: http
                        initialDelaySeconds: 10
                        periodSeconds: 30
                  volumes:
                    - name: html
                      configMap:
                        name: hello-app-html
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: hello-app
              namespace: hello-app
              labels:
                app: hello-app
                csoc.js2.org/managed: "true"
              annotations:
                service.beta.kubernetes.io/openstack-internal-load-balancer: "true"
            spec:
              selector:
                app: hello-app
              ports:
                - name: http
                  port: 80
                  targetPort: http
              type: LoadBalancer
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name + "-hello-app"}
          namespace: ${schema.metadata.namespace}
    - id: resourceset
      includeWhen:
        - ${schema.spec.target == "spoke"}
      readyWhen:
        - ${resourceset.?status.?conditions.orValue([]).exists(c, c.type == "ResourcesApplied" && c.status == "True")}
      template:
        apiVersion: addons.cluster.x-k8s.io/v1beta2
        kind: ClusterResourceSet
        metadata:
          name: ${schema.metadata.name + "-hello-app"}
          namespace: ${schema.metadata.namespace}
        spec:
          clusterSelector:
            matchLabels:
              csoc.js2.org/spoke-cluster: ${schema.metadata.name}
          resources:
            - kind: ConfigMap
              name: ${workload.metadata.name}
          strategy: Reconcile
  schema:
    additionalPrinterColumns:
      - jsonPath: .status.target
        name: Target
        type: string
      - jsonPath: .status.ready
        name: Ready
        type: boolean
    apiVersion: v1alpha1
    group: apps.csoc.js2.org
    kind: HelloApp
    scope: Namespaced
    spec:
      replicas: integer | default=2 minimum=1 maximum=3
      target: string | default="spoke" enum="csoc,spoke"
    status:
      clusterName: '${schema.spec.target == "spoke" ? schema.metadata.name : "csoc"}'
      ready: '${schema.spec.target == "csoc" ? (csocdeployment.?status.?availableReplicas.orValue(0) >= csocdeployment.spec.replicas && csocservice.?status.?loadBalancer.?ingress.orValue([]).size() > 0) : resourceset.?status.?conditions.orValue([]).exists(c, c.type == "ResourcesApplied" && c.status == "True")}'
      target: ${schema.spec.target}
