apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata: {name: jupyteroutpostinstance.services.csoc.js2.org, annotations: {argocd.argoproj.io/sync-wave: "-5"}}
spec:
  schema:
    apiVersion: v1alpha1
    group: services.csoc.js2.org
    kind: JupyterOutpostInstance
    scope: Namespaced
    spec:
      boundaryRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      poolRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      homeStorageRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      secretBundleRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      endpointRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      gpuRuntimeRef: {name: 'string | default="" pattern="^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      imageDigestAllowlist: string | required=true pattern="^[A-Za-z0-9._/:@,-]+@sha256:[0-9a-f]{64}(,[A-Za-z0-9._/:@-]+@sha256:[0-9a-f]{64})*$"
      configRepository: string | required=true pattern="^https://github\\.com/.+$"
      configCommit: string | required=true pattern="^[0-9a-f]{40}$"
      configPath: string | required=true pattern="^[A-Za-z0-9._/-]+$"
      chartVersion: string | required=true pattern="^2\\.1\\.2$"
    status: {ready: '${boundary.spec.serviceType == "jupyter-outpost" && (pool.spec.class == "cpu" || pool.spec.class == "gpu" || pool.spec.class == "mig") && pool.spec.clusterRef.name == boundary.status.clusterName && endpoint.spec.placement == "restrictedPublicLoadBalancer" && application.?status.?health.?status.orValue("") == "Healthy" && application.?status.?sync.?status.orValue("") == "Synced"}', health: '${application.?status.?health.?status.orValue("Progressing")}', syncRevision: '${application.?status.?sync.?revision.orValue("")}' }
  resources:
    - id: boundary
      externalRef: {apiVersion: delivery.csoc.js2.org/v1alpha1, kind: ApplicationBoundary, metadata: {name: '${schema.spec.boundaryRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: pool
      externalRef: {apiVersion: infra.csoc.js2.org/v1alpha1, kind: SpokeNodePool, metadata: {name: '${schema.spec.poolRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: secrets
      externalRef: {apiVersion: delivery.csoc.js2.org/v1alpha1, kind: SecretBundle, metadata: {name: '${schema.spec.secretBundleRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: endpoint
      externalRef: {apiVersion: delivery.csoc.js2.org/v1alpha1, kind: EndpointBinding, metadata: {name: '${schema.spec.endpointRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: application
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata: {name: '${schema.metadata.namespace + "-" + schema.metadata.name}', namespace: argocd}
        spec:
          project: ${boundary.status.projectName}
          source:
            repoURL: ${schema.spec.configRepository}
            targetRevision: ${schema.spec.configCommit}
            path: .
            plugin: {name: csoc-sops-helm, env: [{name: MODE, value: helm}, {name: CONFIG_PATH, value: '${schema.spec.configPath}'}, {name: HELM_CHART, value: jupyter-jsc/jupyterhub-outpost}, {name: HELM_VERSION, value: '${schema.spec.chartVersion}'}, {name: IMAGE_DIGEST_ALLOWLIST, value: '${schema.spec.imageDigestAllowlist}'}]}
          destination: {name: '${boundary.status.clusterName}', namespace: '${boundary.spec.destinationNamespace}'}
          syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true, ServerSideApply=true]}
          revisionHistoryLimit: 3
