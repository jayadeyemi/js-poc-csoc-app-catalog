apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata: {name: s3volumebinding.delivery.csoc.js2.org, annotations: {argocd.argoproj.io/sync-wave: "-6"}}
spec:
  schema:
    apiVersion: v1alpha1
    group: delivery.csoc.js2.org
    kind: S3VolumeBinding
    scope: Namespaced
    spec:
      boundaryRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      addonRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      bucketName: string | required=true pattern="^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
      endpoint: string | required=true pattern="^https://[^[:space:]]+$"
      secretBundleRef: {name: 'string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"'}
      claimName: string | required=true pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
    status: {ready: '${contract.metadata.name != ""}', claimName: '${schema.spec.claimName}', bucketName: '${schema.spec.bucketName}'}
  resources:
    - id: boundary
      externalRef: {apiVersion: delivery.csoc.js2.org/v1alpha1, kind: ApplicationBoundary, metadata: {name: '${schema.spec.boundaryRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: addon
      externalRef: {apiVersion: delivery.csoc.js2.org/v1alpha1, kind: S3CSIAddon, metadata: {name: '${schema.spec.addonRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: secrets
      externalRef: {apiVersion: delivery.csoc.js2.org/v1alpha1, kind: SecretBundle, metadata: {name: '${schema.spec.secretBundleRef.name}', namespace: '${schema.metadata.namespace}'}}
    - id: contract
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata: {name: '${schema.metadata.name}', namespace: '${schema.metadata.namespace}', annotations: {argocd.argoproj.io/sync-options: Prune=false}}
        immutable: true
        data: {bucketName: '${schema.spec.bucketName}', endpoint: '${schema.spec.endpoint}', claimName: '${schema.spec.claimName}', destinationNamespace: '${boundary.spec.destinationNamespace}'}
