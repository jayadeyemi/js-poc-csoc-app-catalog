apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: spokepolicy
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    kro.run/description: Account-parameterized admission restrictions for CSOC spokes
spec:
  schema:
    apiVersion: v1alpha1
    group: apps.csoc.js2.org
    kind: SpokePolicy
    scope: Cluster
    spec: {}
    status:
      ready: '${policy.metadata.name != ""}'
  resources:
    - id: policy
      template:
        apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicy
        metadata:
          name: spokecluster-account-restrictions.csoc.js2.org
        spec:
          failurePolicy: Fail
          paramKind:
            apiVersion: csoc.js2.org/v1alpha1
            kind: CSOCIdentity
          matchConstraints:
            resourceRules:
              - apiGroups: [csoc.js2.org]
                apiVersions: [v1alpha1]
                operations: [CREATE, UPDATE]
                resources: [spokeclusters]
          validations:
            - expression: object.spec.kubernetes.minNodes <= object.spec.kubernetes.maxNodes
              message: spec.kubernetes.minNodes must be less than or equal to maxNodes
            - expression: object.spec.kubernetes.minNodes >= 1
              message: minimum workers permitted by the SpokeCluster RGD is 1
            - expression: object.spec.kubernetes.maxNodes <= 4
              message: maximum workers permitted by the SpokeCluster RGD is 4
