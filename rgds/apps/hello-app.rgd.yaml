apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: helloapp
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    kro.run/description: CSOC-local Hello application workload
spec:
  schema:
    apiVersion: v1alpha1
    group: apps.csoc.js2.org
    kind: HelloApp
    scope: Cluster
    additionalPrinterColumns:
      - name: Ready
        type: boolean
        jsonPath: .status.ready
      - name: URL
        type: string
        jsonPath: .status.service
    spec:
      replicas: integer | default=2 minimum=1 maximum=3
    status:
      ready: '${deployment.?status.?availableReplicas.orValue(0) == schema.spec.replicas}'
      service: '${"http://" + service.metadata.name + "." + appnamespace.metadata.name + ".svc.cluster.local"}'
  resources:
    - id: appnamespace
      readyWhen:
        - '${appnamespace.?status.?phase.orValue("") == "Active"}'
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: hello-app
          labels:
            csoc.js2.org/managed: "true"
            csoc.js2.org/app: hello-app
    - id: html
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: hello-app-html
          namespace: ${appnamespace.metadata.name}
        data:
          index.html: |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <title>Hello App</title>
              <style>
                body { font-family: sans-serif; max-width: 640px; margin: 80px auto; color: #333; }
                h1 { color: #1a6bb5; }
              </style>
            </head>
            <body>
              <h1>Hello from every spoke.</h1>
              <p>This app is managed by the Jetstream2 CSOC GitOps platform.</p>
            </body>
            </html>
    - id: deployment
      readyWhen:
        - '${deployment.?status.?availableReplicas.orValue(0) > 0}'
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: hello-app
          namespace: ${appnamespace.metadata.name}
          labels:
            app: hello-app
            csoc.js2.org/managed: "true"
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app: hello-app
          template:
            metadata:
              labels:
                app: hello-app
            spec:
              containers:
                - name: hello-app
                  image: nginx:1.25-alpine
                  ports:
                    - name: http
                      containerPort: 80
                  volumeMounts:
                    - name: html
                      mountPath: /usr/share/nginx/html
                      readOnly: true
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: 100m
                      memory: 128Mi
                  readinessProbe:
                    httpGet:
                      path: /
                      port: http
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  livenessProbe:
                    httpGet:
                      path: /
                      port: http
                    initialDelaySeconds: 10
                    periodSeconds: 30
              volumes:
                - name: html
                  configMap:
                    name: ${html.metadata.name}
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: hello-app
          namespace: ${appnamespace.metadata.name}
          labels:
            app: hello-app
            csoc.js2.org/managed: "true"
        spec:
          selector:
            app: hello-app
          ports:
            - name: http
              port: 80
              targetPort: http
          type: ClusterIP
